<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <script>
        (function () {
            const savedTheme = localStorage.getItem("siteTheme");
            const theme = savedTheme === "light" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <title>Проекты — Матвей Архипов</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <a href="index.html" class="logo">
            <img src="logo-site.png" alt="Матвей Архипов">
        </a>

        <nav class="main-nav">
            <a href="index.html">Главная</a>
            <a href="index.html#about">Обо мне</a>
            <a href="index.html#skills">Навыки</a>
            <a href="projects.html" class="active">Проекты</a>
            <a href="blog.html">Блог</a>
            <a href="index.html#reviews">Отзывы</a>
            <a href="index.html#contacts">Контакты</a>
        </nav>

        <div class="theme-picker">

            <button
                type="button"
                id="themePickerButton"
                aria-expanded="false"
                aria-label="Выбрать тему"
            >
                <span class="theme-picker-text">Тёмная тема</span>
                <span class="theme-picker-arrow">☀</span>
            </button>

            <div id="themeMenu" class="theme-menu"></div>

        </div>

    </div>
</header>


<main>

    <section class="page-hero">
        <div class="container">

            <p class="hero-label">ПОРТФОЛИО</p>

            <h1>Мои проекты</h1>

            <p>
                Здесь собраны проекты, над которыми я работал
                или которые создавал в процессе обучения и развития.
            </p>

        </div>
    </section>


    <section class="section">
        <div class="container">

            <div id="projectsList" class="projects-grid">
                <p class="loading-text">Загружаем проекты...</p>
            </div>

        </div>
    </section>

</main>


<footer class="site-footer">
    <div class="container footer-inner">

        <p>
            © 2026 Матвей Архипов
        </p>

        <a href="admin.html">
            Администрирование
        </a>

    </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="projects.js"></script>

</body>
</html>
