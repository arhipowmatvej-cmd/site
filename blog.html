<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Блог — Матвей Архипов</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script>
        (function () {

            const savedTheme =
                localStorage.getItem("siteTheme");

            const theme =
                savedTheme === "light"
                    ? "light"
                    : "dark";

            document.documentElement
                .setAttribute(
                    "data-theme",
                    theme
                );

        })();
    </script>

</head>


<body>


<header>

    <a
        href="index.html"
        class="logo"
    >

        <img
            src="logo-site.png"
            alt="Матвей Архипов"
        >

    </a>


    <nav>

        <a href="index.html">
            Главная
        </a>

        <a href="projects.html">
            Проекты
        </a>

        <a href="blog.html">
            Блог
        </a>

    </nav>


    <div class="theme-picker">

        <button
            type="button"
            id="themePickerButton"
            aria-expanded="false"
            aria-label="Выбрать тему"
        >

            <span class="theme-picker-text">
                Тёмная тема
            </span>

            <span class="theme-picker-arrow">
                ☀
            </span>

        </button>


        <div
            id="themeMenu"
            class="theme-menu"
        ></div>

    </div>

</header>



<main>

    <section class="blog-section">

        <div class="section-label">
            БЛОГ
        </div>


        <div class="blog-content">

            <div class="blog-header">

                <div>

                    <h1>
                        Блог
                    </h1>

                    <p class="blog-subtitle">
                        Здесь я публикую заметки, наблюдения,
                        проекты и материалы, которыми хочу поделиться.
                    </p>

                </div>

            </div>


            <div
                id="blogPosts"
                class="blog-posts"
            >

                <p class="reviews-message">
                    Загружаем публикации...
                </p>

            </div>

        </div>

    </section>

</main>



<footer>

    <p>
        © 2026 Матвей Архипов
    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>

<script src="blog.js"></script>


</body>

</html>
